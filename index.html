<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IG Cera Alveolada</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f1e4;--card:#fffdf6;--ink:#2b2412;--mut:#7a6d4d;--line:#e2d6b3;--ac:#b9770e;--acb:#fff;--ok:#2f7d3b;--bad:#b3341f;--wax:#f0c24b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b170c;--card:#262012;--ink:#f3ead0;--mut:#b2a47a;--line:#3d3418;--ac:#e8a93a;--acb:#1b170c;--ok:#6fc47c;--bad:#ef7d68}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b170c;--card:#262012;--ink:#f3ead0;--mut:#b2a47a;--line:#3d3418;--ac:#e8a93a;--acb:#1b170c;--ok:#6fc47c;--bad:#ef7d68}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Serif 4",Georgia,serif}
h1,h2,h3,button,label,th,.tab{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
header{background:var(--wax);color:#2b2412;padding:14px 16px 0;background-image:repeating-linear-gradient(60deg,transparent 0 22px,rgba(0,0,0,.05) 22px 23px)}
header h1{margin:0 0 10px;font-size:26px;letter-spacing:.3px}
nav{display:flex;gap:4px;overflow-x:auto}
.tab{background:transparent;border:0;padding:9px 14px;font-size:18px;color:#2b2412;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
.tab.on{background:var(--bg);color:var(--ink);font-weight:700}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font:700 30px "Barlow Condensed",Arial,sans-serif}
.kpi span{color:var(--mut);font-size:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:block;font-size:15px;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button.b{background:var(--ac);color:var(--acb);border:0;border-radius:6px;padding:10px 16px;font-size:18px;font-weight:700;cursor:pointer}
button.s{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:16px;cursor:pointer}
button.wa{background:#1fa855;color:#fff;border:0;border-radius:6px;padding:5px 10px;font-size:16px;cursor:pointer}
button.x{color:var(--bad);border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:16px}
td.n,th.n{text-align:right}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.tag{padding:2px 8px;border-radius:99px;font-size:13px;border:1px solid var(--line)}
.tag.a{background:var(--wax);color:#2b2412;border-color:var(--wax)}
.prev{margin-top:10px;padding:10px;background:var(--bg);border:1px dashed var(--line);border-radius:6px}
.mut{color:var(--mut);font-size:14px}.act{display:flex;gap:6px;flex-wrap:wrap}
#pa{display:none}
@media print{
 @page{margin:8mm}
 body>*:not(#pa){display:none!important}
 body{background:#fff}
 #pa{display:grid;grid-template-columns:1fr 1fr;gap:4mm;color:#000}
 .lb{border:1.5px solid #000;border-radius:3mm;padding:3mm;height:62mm;break-inside:avoid;font-family:Arial,sans-serif;display:flex;flex-direction:column;justify-content:space-between}
 .lb h4{margin:0;font-size:12pt;border-bottom:1.5px solid #000;padding-bottom:1mm}
 .lb .t{font-size:20pt;font-weight:800;line-height:1.1}
 .lb p{margin:0;font-size:10pt}
}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}.hd h1{margin:0!important}.lg{height:68px;width:68px}
.b.sm{padding:5px 10px;font-size:16px}.tag.p{background:#3b7bd1;color:#fff;border-color:#3b7bd1}
@media print{.lb .lh{display:flex;align-items:center;gap:2mm;border-bottom:1.5px solid #000;padding-bottom:1mm}.lb .lh h4{border:0;padding:0}.lb img{height:14mm;width:14mm}}
.tag.ok{background:var(--ok);color:var(--acb);border-color:var(--ok)}
</style>
</head>
<body>
<header><div class="hd"><img id="lg" class="lg" alt="Logo"><h1 id="ttl"></h1></div><nav id="nav"></nav></header>
<main id="m"></main>
<div id="pa"></div>

rec:[],ord:[],seq:{rec:0,ord:0,id:10}};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.ord=S.ord.map(o=>{if(o.kg===undefined){o.kg=(o.pacotes||0)*(o.laminas||0)*(o.pesoL||0)/1000;o.pk=o.status=='Concluído'?[{qtd:o.pacotes,peso:o.laminas*o.pesoL/1000,laminas:o.laminas}]:[]}o.pk=Array.isArray(o.pk)?o.pk:[];return o});
let tab='dash',pend=null,msg='',edR=null,edO=null,pk=null,pre=null,edA=null,fl={de:'',ate:'',cid:'',loc:''};

const R=v=>'R$ '+(Math.round(v*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const valor=r=>r.peso*r.preco,pagoV=r=>r.valorPago||0;

const apO=id=>S.ap.find(a=>a.id==id)||{};

function grpTab(recs,key,t){
 const m={};recs.forEach(r=>{const k=key(apO(r.ap)),g=m[k]||(m[k]={kg:0,v:0,p:0,n:new Set()});g.kg+=r.peso;g.v+=valor(r);g.p+=pagoV(r);g.n.add(r.ap)});
 return `<div class="card"><h2>Por ${t}</h2><div class="tw"><table><tr><th>${t}</th><th class="n">Apicultores</th><th class="n">Cera recebida</th><th class="n">Valor</th><th class="n">Pago</th><th class="n">A receber</th></tr>${Object.keys(m).sort().map(k=>{const g=m[k];return `<tr><td>${esc(k)}</td><td class="n">${g.n.size}</td><td class="n">${kg(g.kg)}</td><td class="n">${R(g.v)}</td><td class="n">${R(g.p)}</td><td class="n ${g.v-g.p>0.005?'neg':'pos'}">${R(g.v-g.p)}</td></tr>`}).join('')||'<tr><td colspan=6 class="mut">Sem dados.</td></tr>'}</table></div></div>`;
}

const opts=(arr,sel)=>arr.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.nome)}</option>`).join('');

function dash(){
 const cc=S.ord.filter(o=>o.status=='Concluído'),aps=S.ap.filter(a=>recebido(a.id)>0);
 const tr=S.rec.reduce((s,r)=>s+r.peso,0),pf=cc.reduce((s,o)=>s+finalKg(o),0);
 const fila=S.ord.filter(o=>o.status!='Concluído').length,sd=aps.reduce((s,a)=>s+saldo(a.id),0);
 const rf=S.rec.reduce((s,r)=>s+valor(r),0),rp=S.rec.reduce((s,r)=>s+pagoV(r),0);
 const porTipo=S.tipos.map(t=>{const os=cc.filter(o=>o.tipo==t.id);return `<tr><td>${esc(t.nome)}</td><td class="n">${os.reduce((s,o)=>s+nPk(o),0)}</td><td class="n">${kg(os.reduce((s,o)=>s+finalKg(o),0))}</td></tr>`}).join('');
 return `<div class="kpis"><div class="kpi"><b>${kg(tr)}</b><span>Cera bruta recebida</span></div><div class="kpi"><b>${kg(pf)}</b><span>Lâminas prontas</span></div><div class="kpi"><b class="${sc(sd)}">${kg(sd)}</b><span>Saldo sem ordem</span></div><div class="kpi"><b>${fila}</b><span>Ordens na fila/produção</span></div><div class="kpi"><b>${cc.reduce((s,o)=>s+nPk(o),0)}</b><span>Pacotes prontos</span></div><div class="kpi"><b class="${rf-rp>0.005?'neg':'pos'}">${R(rf-rp)}</b><span>A receber dos apicultores</span></div></div>
 <div class="card"><h2>Apicultores com cera</h2><div class="tw"><table><tr><th>Apicultor</th><th>Local</th><th class="n">Recebido</th><th class="n">Em ordens</th><th class="n">Saldo</th><th></th></tr>
 ${aps.map(a=>`<tr><td>${esc(a.nome)}</td><td>${esc([a.loc,a.cid].filter(Boolean).join(' · '))}</td><td class="n">${kg(recebido(a.id))}</td><td class="n">${kg(usado(a.id))}</td><td class="n ${sc(saldo(a.id))}">${kg(saldo(a.id))}</td><td><button class="s" onclick="extrato(${a.id})">Extrato</button></td></tr>`).join('')||'<tr><td colspan=6 class="mut">Nenhuma cera recebida ainda. Registre em Receber cera.</td></tr>'}</table></div></div>
 ${grpTab(S.rec,mun,'município')}${grpTab(S.rec,lcl,'localidade/comunidade')}
 <div class="card"><h2>Produção concluída por tipo</h2><div class="tw"><table><tr><th>Tipo</th><th class="n">Pacotes</th><th class="n">Peso</th></tr>${porTipo}</table></div></div><div id="ext"></div>`;
}
function extrato(id){
 const ev=[...S.rec.filter(r=>r.ap==id).map(r=>({d:r.data,t:'Recebido (recibo '+r.n+')',v:r.peso})),...S.ord.filter(o=>o.ap==id).map(o=>({d:o.data,t:'Ordem '+o.n+' · '+tpN(o.tipo)+' · '+kg(o.kg),v:-brutoKg(o)}))].sort((a,b)=>a.d<b.d?-1:1);
 let acc=0;
 $('ext').innerHTML=`<div class="card"><h2>Extrato · ${esc(apN(id))}</h2><div class="tw"><table><tr><th>Data</th><th>Movimento</th><th class="n">Cera bruta</th><th class="n">Saldo</th></tr>${ev.map(e=>{acc+=e.v;return `<tr><td>${dt(e.d)}</td><td>${esc(e.t)}</td><td class="n">${kg(e.v)}</td><td class="n">${kg(acc)}</td></tr>`}).join('')}</table></div></div>`;
 $('ext').scrollIntoView();
}
function rec(){
 const r=S.rec.find(x=>x.id==edR)||{};
 return `<div class="card"><h2>${edR?'Editar recebimento nº '+r.n:'Registrar cera bruta recebida'}</h2><div class="row">
 <div><label>Apicultor</label><select id="rA">${opts(S.ap,r.ap)}</select></div>
 <div><label>Peso recebido (kg)</label><input id="rP" inputmode="decimal" placeholder="0,000" value="${r.peso??''}" oninput="calcV()"></div>
 <div><label>Valor por kg (R$)</label><input id="rR" inputmode="decimal" value="${r.preco??S.cfg.preco}" oninput="calcV()"></div>
 <div><label>Data</label><input id="rD" type="date" value="${r.data||hoje()}"></div>
 <div><label>Forma de pagamento</label><select id="rF"><option value="">Ainda não pago</option>${FORMAS.map(f=>`<option ${r.forma==f?'selected':''}>${f}</option>`).join('')}</select></div>
 <div><label>Valor pago (R$)</label><input id="rG" inputmode="decimal" placeholder="vazio = valor total" value="${r.valorPago||''}"></div>
 <div><label>Observação</label><input id="rO" value="${esc(r.obs||'')}" placeholder="Ex.: cera de opérculo"></div>
 <div class="act"><button class="b" onclick="addRec()">${edR?'Salvar alteração':'Salvar recebimento'}</button>${edR?'<button class="s" onclick="go(\'rec\')">Cancelar</button>':''}</div></div>
 <div class="prev" id="rv"></div></div>
 <div class="card"><h2>Recebimentos</h2><div class="tw"><table><tr><th>Recibo</th><th>Data</th><th>Apicultor</th><th class="n">Peso</th><th class="n">Valor</th><th>Pagamento</th><th>Obs.</th><th></th></tr>
 ${[...S.rec].reverse().map(r=>`<tr><td>${r.n}</td><td>${dt(r.data)}</td><td>${esc(apN(r.ap))}</td><td class="n">${kg(r.peso)}</td><td class="n">${R(valor(r))}</td><td><span class="tag ${TG[stPg(r)]}">${stPg(r)}</span>${pagoV(r)?`<div class="mut">${R(pagoV(r))} · ${esc(r.forma||'')}</div>`:''}</td><td>${esc(r.obs)}</td><td class="act"><button class="wa" onclick="zap(${r.id})">WhatsApp</button><button class="s" onclick="editRec(${r.id})">Editar / pagar</button><button class="s" onclick="copia(${r.id})">Copiar</button>${delB('rec',r.id)}</td></tr>`).join('')||'<tr><td colspan=8 class="mut">Nenhum recebimento ainda.</td></tr>'}</table></div></div>`;
}
function editRec(id){edR=id;msg='';render();scrollTo(0,0)}
function calcV(){const e=$('rv');if(e)e.innerHTML='Valor do serviço: <b>'+R(num($('rP').value)*num($('rR').value))+'</b>'}
function addRec(){
 const a=$('rA').value,p=num($('rP').value),pr=num($('rR').value),f=$('rF').value;
 if(!a||p<=0){msg='Escolha o apicultor e informe o peso.';return render()}
 let vp=0;if(f){vp=$('rG').value.trim()?num($('rG').value):p*pr}
 const d={data:$('rD').value||hoje(),ap:+a,peso:p,preco:pr,forma:f,valorPago:vp,obs:$('rO').value};
 if(edR){Object.assign(S.rec.find(x=>x.id==edR),d);edR=null;msg='Recebimento alterado. Reenvie o recibo se necessário.'}
 else{S.rec.push({id:nid(),n:++S.seq.rec,...d});msg='Recebimento salvo. Envie o recibo pelo botão WhatsApp.'}
 save();render();
}
function reciboTxt(r){
 const f=stPg(r);
 return `*${S.cfg.empresa}*\n*RECIBO DE CERA BRUTA Nº ${r.n}*\n\nApicultor: ${apN(r.ap)}\nData: ${dt(r.data)}\nPeso entregue: *${kg(r.peso)}*${r.obs?'\nObs.: '+r.obs:''}\n\nValor do serviço: ${R(valor(r))} (${R(r.preco)}/kg)\nPagamento: ${f}${pagoV(r)?' · '+R(pagoV(r))+' em '+r.forma:''}${f!='Pago'?'\nFalta pagar: '+R(valor(r)-pagoV(r)):''}\n\nTotal de cera bruta em seu nome: ${kg(recebido(r.ap))}\n\nObrigado pela confiança! 🐝`;
}
function openWa(apId,t){
 const a=S.ap.find(x=>x.id==apId)||{};let n=String(a.tel||'').replace(/\D/g,'');if(n&&n.length<=11)n='55'+n;
 window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t),'_blank');
}
const zap=id=>{const r=S.rec.find(x=>x.id==id);openWa(r.ap,reciboTxt(r))};
function copia(id){
 const t=reciboTxt(S.rec.find(x=>x.id==id));
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{msg='Recibo copiado.';render()}).catch(()=>{msg='Não foi possível copiar automaticamente.';render()});
}
function msgIni(o){
 return `*${S.cfg.empresa}*\n*PRODUÇÃO INICIADA* 🐝\n\nOlá, ${apN(o.ap)}! Sua cera entrou em produção.\n\nLote: ${o.n}\nTipo: ${tpN(o.tipo)}\nQuantidade a produzir: *${kg(o.kg)}*\nInício: ${dt(o.dtIni)}\n\nAvisaremos quando estiver pronta e empacotada.`;
}
function msgFim(o){
 return `*${S.cfg.empresa}*\n*PRODUÇÃO CONCLUÍDA* ✅\n\nOlá, ${apN(o.ap)}! Sua cera alveolada ficou pronta e empacotada.\n\nLote: ${o.n}\nTipo: ${tpN(o.tipo)}\nConclusão: ${dt(o.dtFim)}\n\n*Pacotes:*\n${o.pk.map(p=>`• ${p.qtd} pacote(s) de ${kg(p.peso)}${p.laminas?' ('+p.laminas+' lâminas)':''}`).join('\n')}\n\nTotal: *${nPk(o)} pacotes · ${kg(finalKg(o))}*\nSaldo de cera bruta restante: ${kg(saldo(o.ap))}\n\nJá pode retirar. Obrigado! 🐝`;
}
function prod(){
 const o=S.ord.find(x=>x.id==edO)||{};
 const wait=S.ap.map(a=>({a,s:saldo(a.id),d:(S.rec.filter(r=>r.ap==a.id)[0]||{}).data||'9'})).filter(x=>x.s>0.0005).sort((x,y)=>x.d<y.d?-1:1);
 const q=[...S.ord.filter(x=>x.status!='Concluído').sort((x,y)=>x.n-y.n),...S.ord.filter(x=>x.status=='Concluído').sort((x,y)=>y.n-x.n)];
 let pos=0;
 return `<div class="card"><h2>${edO?'Editar ordem · lote '+o.n:'Nova ordem de produção'}</h2><div class="row">
 <div><label>Apicultor</label><select id="oA" onchange="calc()">${opts(S.ap,o.ap||pre)}</select></div>
 <div><label>Tipo</label><select id="oT">${opts(S.tipos,o.tipo)}</select></div>
 <div><label>Quilos a produzir</label><input id="oK" inputmode="decimal" value="${o.kg??(pre?Math.floor(saldo(pre)*perdaF()*100)/100:'')}" oninput="calc()"></div>
 <div class="act"><button class="b" onclick="addOrd()">${edO?'Salvar alteração':'Adicionar à fila'}</button>${edO?'<button class="s" onclick="go(\'prod\')">Cancelar</button>':''}</div></div>
 <div class="prev" id="pv"></div></div>
 ${pk?pkPanel():''}
 <div class="card"><h2>Cera aguardando ordem</h2><p class="mut">Apicultores com cera recebida que ainda não está em nenhuma ordem, na ordem de chegada.</p><div class="tw"><table><tr><th>Apicultor</th><th class="n">Cera bruta disponível</th><th></th></tr>
 ${wait.map(x=>`<tr><td>${esc(x.a.nome)}</td><td class="n">${kg(x.s)}</td><td><button class="s" onclick="mk(${x.a.id})">Criar ordem</button></td></tr>`).join('')||'<tr><td colspan=3 class="mut">Toda a cera recebida já está em ordens.</td></tr>'}</table></div></div>
 <div class="card"><h2>Fila de produção</h2><div class="tw"><table><tr><th>Fila</th><th>Lote</th><th>Apicultor</th><th>Tipo</th><th class="n">A produzir</th><th class="n">Cera bruta</th><th>Status</th><th></th></tr>
 ${q.map(x=>`<tr><td>${x.status=='Concluído'?'':++pos}</td><td>${x.n}</td><td>${esc(apN(x.ap))}</td><td>${esc(tpN(x.tipo))}</td><td class="n">${kg(x.kg)}</td><td class="n">${kg(brutoKg(x))}</td><td><span class="tag ${ST[x.status]}">${x.status}</span>${x.pk.length?`<div class="mut">${nPk(x)} pct · ${kg(finalKg(x))}</div>`:''}</td><td class="act">
 ${x.status=='Na fila'?`<button class="b sm" onclick="ini(${x.id})">Iniciar produção</button>`:''}
 ${x.status=='Em produção'?`<button class="b sm" onclick="openPk(${x.id})">Empacotar e concluir</button>`:''}
 ${x.status=='Concluído'?`<button class="s" onclick="openPk(${x.id})">Pacotes</button>`:''}
 ${x.dtIni?`<button class="wa" onclick="openWa(${x.ap},msgIni(S.ord.find(o=>o.id==${x.id})))">Msg início</button>`:''}
 ${x.status=='Concluído'?`<button class="wa" onclick="openWa(${x.ap},msgFim(S.ord.find(o=>o.id==${x.id})))">Msg conclusão</button><button class="s" onclick="etq(${x.id})">Etiquetas</button>`:''}
 <button class="s" onclick="editOrd(${x.id})">Editar</button>${delB('ord',x.id)}</td></tr>`).join('')||'<tr><td colspan=8 class="mut">Nenhuma ordem na fila.</td></tr>'}</table></div></div>`;
}
function mk(a){pre=a;edO=null;render();scrollTo(0,0)}
function editOrd(id){edO=id;pk=null;msg='';render();scrollTo(0,0)}
function calc(){
 if(!$('pv'))return;
 const a=+$('oA').value,k=num($('oK').value),b=k/perdaF(),own=edO?brutoKg(S.ord.find(x=>x.id==edO)):0,s=a?saldo(a)+own:0;
 $('pv').innerHTML=`Cera bruta necessária (com ${S.cfg.perda}% de perda): <b>${kg(b)}</b> · Saldo do apicultor: <b class="${sc(s-b)}">${kg(s)}</b> ${s-b<0?'— faltam '+kg(b-s)+' de cera bruta.':'— sobram '+kg(s-b)+'.'}`;
}
function addOrd(){
 const d={ap:+$('oA').value,tipo:+$('oT').value,kg:num($('oK').value)};
 if(!d.ap||!d.tipo||d.kg<=0){msg='Escolha o apicultor, o tipo e informe os quilos.';return render()}
 if(edO){Object.assign(S.ord.find(x=>x.id==edO),d);edO=null;msg='Ordem alterada.'}
 else{S.ord.push({id:nid(),n:++S.seq.ord,data:hoje(),status:'Na fila',pk:[],...d});pre=null;msg='Ordem adicionada à fila.'}
 save();render();
}
function ini(id){const o=S.ord.find(x=>x.id==id);o.status='Em produção';o.dtIni=hoje();save();msg='Produção iniciada. Use "Msg início" para avisar o apicultor.';render()}
function openPk(id){
 const o=S.ord.find(x=>x.id==id);
 pk={id,rows:o.pk.length?o.pk.map(p=>({...p})):[{qtd:'',peso:'',laminas:''}]};edO=null;render();scrollTo(0,0);
}
function pkPanel(){
 const o=S.ord.find(x=>x.id==pk.id);
 return `<div class="card"><h2>Pacotes · lote ${o.n} · ${esc(apN(o.ap))} · ${esc(tpN(o.tipo))}</h2><p class="mut">Informe cada grupo de pacotes com o mesmo peso. Previsto: ${kg(o.kg)}.</p>
 ${pk.rows.map((p,i)=>`<div class="row" style="margin-bottom:8px"><div><label>Nº de pacotes</label><input inputmode="numeric" value="${p.qtd}" oninput="pk.rows[${i}].qtd=this.value;sumPk()"></div><div><label>Peso de cada pacote (kg)</label><input inputmode="decimal" value="${p.peso}" oninput="pk.rows[${i}].peso=this.value;sumPk()"></div><div><label>Lâminas por pacote (opcional)</label><input inputmode="numeric" value="${p.laminas||''}" oninput="pk.rows[${i}].laminas=this.value"></div><div><button class="s x" onclick="pk.rows.splice(${i},1);render()">Remover linha</button></div></div>`).join('')}
 <div class="prev" id="pks"></div><p class="act"><button class="s" onclick="pk.rows.push({qtd:'',peso:'',laminas:''});render()">Adicionar outro peso</button><button class="b" onclick="savePk()">${o.status=='Concluído'?'Salvar pacotes':'Salvar e concluir produção'}</button><button class="s" onclick="pk=null;render()">Cancelar</button></p></div>`;
}
function sumPk(){
 const e=$('pks');if(!e)return;
 const q=pk.rows.reduce((s,p)=>s+num(p.qtd),0),w=pk.rows.reduce((s,p)=>s+num(p.qtd)*num(p.peso),0);
 e.innerHTML=`Total: <b>${q} pacotes</b> · <b>${kg(w)}</b>`;
}
function savePk(){
 const o=S.ord.find(x=>x.id==pk.id),r=pk.rows.map(p=>({qtd:Math.round(num(p.qtd)),peso:num(p.peso),laminas:Math.round(num(p.laminas))})).filter(p=>p.qtd>0&&p.peso>0);
 if(!r.length){msg='Informe ao menos um grupo com quantidade e peso.';return render()}
 o.pk=r;if(o.status!='Concluído'){o.status='Concluído';o.dtFim=hoje();msg='Produção concluída. Use "Msg conclusão" e "Etiquetas".'}else msg='Pacotes alterados.';
 pk=null;save();render();
}
function etq(id){
 const o=S.ord.find(x=>x.id==id),t=S.tipos.find(x=>x.id==o.tipo)||{},tot=nPk(o);let i=0,h='';
 o.pk.forEach(p=>{for(let j=0;j<p.qtd;j++){i++;h+=`<div class="lb"><div class="lh"><img src="${LOGO}" alt=""><h4>${esc(S.cfg.empresa)}</h4></div><div class="t">${esc(tpN(o.tipo))}</div><p>${t.larg?t.larg+' × '+t.comp+' mm · ':''}${p.laminas?p.laminas+' lâminas · ':''}<b>${kg(p.peso)}</b></p><p>Apicultor: <b>${esc(apN(o.ap))}</b></p><p>Lote ${o.n} · ${dt(o.dtFim)} · Pacote ${i}/${tot}</p></div>`}});
 $('pa').innerHTML=h;setTimeout(()=>window.print(),100);
}
function ap(){
 const a=S.ap.find(x=>x.id==edA)||{};
 return `<div class="card"><h2>${edA?'Editar apicultor':'Cadastrar apicultor'}</h2><div class="row">
 <div><label>Nome</label><input id="aN" value="${esc(a.nome||'')}"></div><div><label>WhatsApp (com DDD)</label><input id="aT" inputmode="tel" placeholder="88 99999-9999" value="${esc(a.tel||'')}"></div>
 <div><label>Município</label><input id="aC" list="dc" value="${esc(a.cid||'')}"></div><div><label>Localidade / Comunidade</label><input id="aL" list="dlc" value="${esc(a.loc||'')}"></div>
 <div><label>Observações</label><input id="aO" value="${esc(a.obs||'')}"></div>
 <div class="act"><button class="b" onclick="addAp()">${edA?'Salvar alteração':'Salvar'}</button>${edA?'<button class="s" onclick="go(\'ap\')">Cancelar</button>':''}</div></div>${dl('dc',S.ap.map(x=>x.cid))}${dl('dlc',S.ap.map(x=>x.loc))}</div>
 <div class="card"><h2>Apicultores</h2><div class="tw"><table><tr><th>Nome</th><th>WhatsApp</th><th>Município</th><th>Localidade</th><th>Observações</th><th class="n">Saldo</th><th></th></tr>
 ${S.ap.map(a=>`<tr><td>${esc(a.nome)}</td><td>${esc(a.tel)}</td><td>${esc(a.cid)}</td><td>${esc(a.loc)}</td><td>${esc(a.obs)}</td><td class="n ${sc(saldo(a.id))}">${kg(saldo(a.id))}</td><td class="act"><button class="s" onclick="edA=${a.id};render();scrollTo(0,0)">Editar</button>${delB('ap',a.id)}</td></tr>`).join('')||'<tr><td colspan=7 class="mut">Nenhum apicultor cadastrado.</td></tr>'}</table></div></div>`;
}
function addAp(){
 const n=$('aN').value.trim();if(!n){msg='Informe o nome do apicultor.';return render()}
 const d={nome:n,tel:$('aT').value,cid:$('aC').value.trim(),loc:$('aL').value.trim(),obs:$('aO').value};
 if(edA){Object.assign(S.ap.find(x=>x.id==edA),d);edA=null;msg='Cadastro alterado.'}else{S.ap.push({id:nid(),...d});msg=''}
 save();render();
}
function fin(){
 const cids=[...new Set(S.ap.map(a=>a.cid).filter(Boolean))].sort(),locs=[...new Set(S.ap.filter(a=>!fl.cid||a.cid==fl.cid).map(a=>a.loc).filter(Boolean))].sort();
 const L=S.rec.filter(r=>{const a=apO(r.ap);return (!fl.de||r.data>=fl.de)&&(!fl.ate||r.data<=fl.ate)&&(!fl.cid||a.cid==fl.cid)&&(!fl.loc||a.loc==fl.loc)}).sort((x,y)=>x.data<y.data?-1:1);
 const k=L.reduce((s,r)=>s+r.peso,0),v=L.reduce((s,r)=>s+valor(r),0),p=L.reduce((s,r)=>s+pagoV(r),0),pf={};
 L.forEach(r=>{if(pagoV(r)>0){const f=r.forma||'Outro';pf[f]=(pf[f]||0)+pagoV(r)}});
 const so=(arr,sel)=>arr.map(x=>`<option ${x==sel?'selected':''}>${esc(x)}</option>`).join('');
 return `<div class="card"><h2>Balanço geral</h2><div class="row">
 <div><label>De</label><input type="date" value="${fl.de}" onchange="fl.de=this.value;render()"></div><div><label>Até</label><input type="date" value="${fl.ate}" onchange="fl.ate=this.value;render()"></div>
 <div><label>Município</label><select onchange="fl.cid=this.value;fl.loc='';render()"><option value="">Todos</option>${so(cids,fl.cid)}</select></div>
 <div><label>Localidade / Comunidade</label><select onchange="fl.loc=this.value;render()"><option value="">Todas</option>${so(locs,fl.loc)}</select></div>
 <div><button class="s" onclick="fl={de:'',ate:'',cid:'',loc:''};render()">Limpar filtros</button></div></div></div>
 <div class="kpis"><div class="kpi"><b>${L.length}</b><span>Recebimentos</span></div><div class="kpi"><b>${kg(k)}</b><span>Cera recebida</span></div><div class="kpi"><b>${R(v)}</b><span>Valor cobrado</span></div><div class="kpi"><b class="pos">${R(p)}</b><span>Já pago</span></div><div class="kpi"><b class="${v-p>0.005?'neg':'pos'}">${R(v-p)}</b><span>A receber</span></div></div>
 <div class="card"><h2>Pago por forma de pagamento</h2><div class="tw"><table>${Object.keys(pf).map(f=>`<tr><td>${f}</td><td class="n">${R(pf[f])}</td></tr>`).join('')||'<tr><td class="mut">Nenhum pagamento no período.</td></tr>'}</table></div></div>
 ${grpTab(L,mun,'município')}${grpTab(L,lcl,'localidade/comunidade')}${grpTab(L,a=>a.nome||'(removido)','apicultor')}
 <div class="card"><h2>Recebimentos do período</h2><div class="tw"><table><tr><th>Recibo</th><th>Data</th><th>Apicultor</th><th class="n">Peso</th><th class="n">Valor</th><th class="n">Pago</th><th>Forma</th><th>Status</th></tr>${L.map(r=>`<tr><td>${r.n}</td><td>${dt(r.data)}</td><td>${esc(apN(r.ap))}</td><td class="n">${kg(r.peso)}</td><td class="n">${R(valor(r))}</td><td class="n">${R(pagoV(r))}</td><td>${esc(r.forma||'')}</td><td><span class="tag ${TG[stPg(r)]}">${stPg(r)}</span></td></tr>`).join('')||'<tr><td colspan=8 class="mut">Nada neste filtro.</td></tr>'}</table></div></div>`;
}
function cfg(){
 return `<div class="card"><h2>Dados da empresa</h2><div class="row">
 <div><label>Nome (aparece nas etiquetas e mensagens)</label><input id="cE" value="${esc(S.cfg.empresa)}"></div>
 <div><label>Perda no processo (%)</label><input id="cP" inputmode="decimal" value="${S.cfg.perda}"></div>
 <div><label>Valor padrão por kg (R$)</label><input id="cV" inputmode="decimal" value="${S.cfg.preco}"></div>
 <div><button class="b" onclick="saveCfg()">Salvar</button></div></div>
 <p class="mut">A perda é a parte da cera bruta que não vira lâmina. O valor padrão vem preenchido em cada novo recebimento, e você pode mudar em cada um.</p></div>
 <div class="card"><h2>Tipos de lâmina</h2><p class="mut">Medidas de exemplo: confira e ajuste conforme o seu molde. Elas saem nas etiquetas.</p><div class="tw"><table><tr><th>Tipo</th><th>Largura mm</th><th>Comprimento mm</th><th></th></tr>
 ${S.tipos.map(t=>`<tr><td><input value="${esc(t.nome)}" onchange="upT(${t.id},'nome',this.value)"></td><td><input value="${t.larg}" onchange="upT(${t.id},'larg',this.value)"></td><td><input value="${t.comp}" onchange="upT(${t.id},'comp',this.value)"></td><td>${delB('tipos',t.id)}</td></tr>`).join('')}</table></div>
 <p><button class="s" onclick="addT()">Adicionar tipo (ex.: Meia melgueira)</button></p></div>
 <div class="card"><h2>Backup</h2><p class="mut">Os dados ficam salvos neste navegador. Gere o backup e guarde o texto em local seguro; para restaurar, cole e use Restaurar.</p>
 <textarea id="bk" rows="4"></textarea><p class="act"><button class="s" onclick="$('bk').value=JSON.stringify(S)">Gerar backup</button><button class="s" onclick="rest()">Restaurar</button></p></div>`;
}
function saveCfg(){S.cfg.empresa=$('cE').value||S.cfg.empresa;S.cfg.perda=Math.min(num($('cP').value),90);S.cfg.preco=num($('cV').value)||8;save();msg='Configurações salvas.';render()}
function upT(id,k,v){const t=S.tipos.find(x=>x.id==id);t[k]=k=='nome'?v:num(v);save()}
function addT(){S.tipos.push({id:nid(),nome:'Novo tipo',larg:410,comp:140,pesoL:30});save();render()}
function rest(){try{const d=JSON.parse($('bk').value);if(!d.cfg||!d.rec)throw 0;S=d;save();msg='Backup restaurado. Recarregue a página.'}catch(e){msg='Backup inválido: cole o texto completo gerado pelo sistema.'}render()}
render();calcV();
</script>
</body>
